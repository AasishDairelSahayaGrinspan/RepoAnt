<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RepoAnt CLI Screenshot</title>
  <desc id="desc">Mock screenshot of RepoAnt terminal interface showing protected repos and delete confirmation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102217"/>
      <stop offset="100%" stop-color="#1d3426"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#f4e8d1"/>
  <rect x="86" y="72" width="1028" height="576" rx="22" fill="url(#bg)" stroke="#385a44" stroke-width="4"/>
  <circle cx="128" cy="112" r="8" fill="#f7ba7f"/>
  <circle cx="152" cy="112" r="8" fill="#f3de8d"/>
  <circle cx="176" cy="112" r="8" fill="#a4da95"/>

  <text x="230" y="119" fill="#bde7bd" font-size="20" font-family="IBM Plex Mono, monospace">repoant delete --multi</text>

  <text x="126" y="170" fill="#89d78c" font-size="20" font-family="IBM Plex Mono, monospace">Select repositories to delete (SPACE to toggle, ENTER to confirm)</text>

  <rect x="120" y="196" width="960" height="1" fill="#395842"/>

  <text x="128" y="242" fill="#d1f0d6" font-size="24" font-family="IBM Plex Mono, monospace">[x] aasishdairel/old-prototype</text>
  <text x="128" y="286" fill="#d1f0d6" font-size="24" font-family="IBM Plex Mono, monospace">[x] aasishdairel/playground-archive</text>
  <text x="128" y="330" fill="#6ba077" font-size="24" font-family="IBM Plex Mono, monospace">[-] aasishdairel/production-api (protected)</text>
  <text x="128" y="374" fill="#d1f0d6" font-size="24" font-family="IBM Plex Mono, monospace">[x] aasishdairel/unused-internal-tool</text>

  <rect x="120" y="430" width="960" height="1" fill="#395842"/>

  <text x="126" y="486" fill="#ffc88c" font-size="24" font-family="IBM Plex Mono, monospace">WARNING: This action is irreversible.</text>
  <text x="126" y="526" fill="#fce3b4" font-size="24" font-family="IBM Plex Mono, monospace">Type DELETE 3 to continue:</text>

  <rect x="454" y="499" width="188" height="38" rx="8" fill="#0d1710" stroke="#4f745b"/>
  <text x="474" y="525" fill="#a6e59d" font-size="23" font-family="IBM Plex Mono, monospace">DELETE 3</text>
</svg>
